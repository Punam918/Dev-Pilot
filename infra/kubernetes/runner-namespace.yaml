# Cluster-administrator bootstrap. Never put production workloads in this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: devpilot-runners
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.30
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devpilot-runner
  namespace: devpilot-runners
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-test-traffic
  namespace: devpilot-runners
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bounded-tests
  namespace: devpilot-runners
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 2Gi
    pods: "4"
    count/jobs.batch: "8"
    count/configmaps: "8"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: test-container-limits
  namespace: devpilot-runners
spec:
  limits:
    - type: Container
      default: {cpu: "1", memory: 512Mi}
      defaultRequest: {cpu: 100m, memory: 128Mi}
      max: {cpu: "1", memory: 512Mi}

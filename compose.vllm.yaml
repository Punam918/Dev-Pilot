name: devpilot-inference
# Optional NVIDIA service. Driver, NVIDIA Container Toolkit, weights and sufficient
# GPU/RAM are YOUR prerequisites. This candidate image was not executed here.
services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.18.2}
    gpus: all
    ports: ["127.0.0.1:18000:8000"]
    shm_size: 2gb
    volumes: [model-cache:/root/.cache/huggingface]
    command:
      - --model
      - Qwen/Qwen3-4B-Instruct-2507
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.8"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
volumes:
  model-cache:

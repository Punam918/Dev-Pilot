# Source: helm/devpilot/templates/deployment.yaml (static Go rendering, NOT helm)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpilot
  labels:
    app.kubernetes.io/name: devpilot
    app.kubernetes.io/instance: devpilot
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: devpilot
      app.kubernetes.io/instance: devpilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devpilot
        app.kubernetes.io/instance: devpilot
      annotations:
        checksum/config: 3a90d64b334d3a7b440efedfe6da7fcbb5da989736b6d6c12c73af8ecd537399
    spec:
      serviceAccountName: devpilot
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: devpilot
          image: "devpilot:local"
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "devpilot", "serve"]
          args: ["--seed"]
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: devpilot-config}
          env:
            - name: DP_POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: DP_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devpilot-secrets
                  key: llm-api-key
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits:
              cpu: '2'
              memory: 1536Mi
            requests:
              cpu: 200m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /livez
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /livez
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: credentials, mountPath: /run/devpilot-secrets, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: devpilot-data
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 128Mi}
        - name: credentials
          secret:
            secretName: devpilot-secrets
            defaultMode: 288
            items:
              - {key: api-token, path: api-token}
              - {key: metrics-token, path: metrics-token}


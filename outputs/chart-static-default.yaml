# Source: helm/devpilot/templates/networkpolicy.yaml (static Go rendering, NOT helm)

# Control-plane egress is intentionally operator-managed: it needs Kubernetes API,
# inference, DNS and optionally OTLP. Runner egress is DENIED in a separate namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devpilot-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devpilot
      app.kubernetes.io/instance: devpilot
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devpilot
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports: [{protocol: TCP, port: 8080}]


[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devpilot-mcp"
version = "0.3.0"
description = "Evidence-first repository debugging with local LLMs, MCP, and explicit approvals"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.128,<0.142",
  "uvicorn>=0.48,<0.49",
  "httpx>=0.28,<0.29",
  "pydantic-settings>=2.14,<3",
  "jsonschema>=4.26,<5",
  "prometheus-client>=0.25,<0.26",
]

[project.optional-dependencies]
observability = ["opentelemetry-sdk>=1.42,<2", "opentelemetry-exporter-otlp-proto-http>=1.42,<2"]
deploy = ["pytest>=9,<10"]
dev = ["PyYAML>=6,<7", "pytest>=9,<10", "pytest-asyncio>=1.3,<2", "pytest-cov>=7,<8", "ruff>=0.11,<1"]
interop = ["mcp>=2,<3"]
ui = ["playwright>=1.57,<2"]

[project.scripts]
devpilot = "devpilot.cli:main"

[tool.setuptools.packages.find]
include = ["devpilot*"]

[tool.setuptools.package-data]
devpilot = ["static/*", "fixtures/**/*", "graders/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = ["docker: needs a local Docker daemon and the runner image", "interop: needs the optional official MCP SDK"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "devpilot.name" . }}
  labels:
    {{- include "devpilot.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if eq .Values.runner.mode "kubernetes" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "devpilot.name" . }}-job-manager
  namespace: {{ .Values.runner.namespace }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "devpilot.name" . }}-job-manager
  namespace: {{ .Values.runner.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "devpilot.name" . }}-job-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "devpilot.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devpilot.name" . }}
  labels:
    {{- include "devpilot.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: devpilot
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devpilot
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "devpilot.name" . }}
      automountServiceAccountToken: {{ eq .Values.runner.mode "kubernetes" }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: devpilot
          image: {{ include "devpilot.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "devpilot", "serve"]
          {{- if .Values.config.seed }}
          args: ["--seed"]
          {{- end }}
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: {{ include "devpilot.name" . }}-config}
          env:
            - name: DP_POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: DP_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: llm-api-key
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /livez
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: credentials, mountPath: /run/devpilot-secrets, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "devpilot.name" .)) }}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 128Mi}
        - name: credentials
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 288
            items:
              - {key: api-token, path: api-token}
              - {key: metrics-token, path: metrics-token}

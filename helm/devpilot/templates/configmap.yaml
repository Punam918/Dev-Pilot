apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devpilot.name" . }}-config
  labels:
    {{- include "devpilot.labels" . | nindent 4 }}
data:
  DP_PROVIDER: {{ .Values.config.provider | quote }}
  DP_MODEL: {{ .Values.config.model | quote }}
  DP_BASE_URL: {{ .Values.config.baseUrl | quote }}
  DP_ALLOW_REMOTE_MODEL: {{ .Values.config.allowRemoteModel | quote }}
  DP_PUBLIC_ORIGIN: {{ .Values.config.publicOrigin | quote }}
  DP_ALLOWED_HOSTS: {{ .Values.config.allowedHosts | toJson | quote }}
  DP_HOST: "0.0.0.0"
  DP_PORT: "8080"
  DP_DATA_DIR: /data/state
  DP_WORKSPACE_DIR: /data/workspace
  DP_RUNNER: {{ .Values.runner.mode | quote }}
  DP_TRUST_LOCAL_CODE: "false"
  DP_DOCKER_TOOLS: "false"
  DP_API_TOKEN_FILE: /run/devpilot-secrets/api-token
  DP_METRICS_TOKEN_FILE: /run/devpilot-secrets/metrics-token
  DP_RUNNER_IMAGE: {{ include "devpilot.image" .Values.runner.image | quote }}
  DP_KUBE_NAMESPACE: {{ .Values.runner.namespace | quote }}
  DP_KUBE_JOB_TIMEOUT: {{ .Values.runner.jobTimeout | quote }}
  DP_KUBE_RUNTIME_CLASS: {{ .Values.runner.runtimeClass | quote }}
  DP_KUBE_IMAGE_PULL_SECRET: {{ .Values.runner.imagePullSecret | quote }}
  DP_TOOL_TIMEOUT: {{ .Values.config.toolTimeout | quote }}
  DP_MAX_RUNS: {{ .Values.config.maxRuns | quote }}
  DP_MAX_CONTEXT_CHARS: {{ .Values.config.maxContextChars | quote }}
  DP_OTEL_ENABLED: {{ .Values.config.otelEnabled | quote }}
  DP_OTEL_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  DP_LOG_JSON: "true"

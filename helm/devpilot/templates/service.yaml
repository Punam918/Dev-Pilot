apiVersion: v1
kind: Service
metadata:
  name: {{ include "devpilot.name" . }}
  labels:
    {{- include "devpilot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: devpilot
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
